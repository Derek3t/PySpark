[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-distributed-simulator"
version = "1.0.0"
description = "Simulador de Processamento Distribuído em Memória com PySpark (Lazy Evaluation, DAG, SQL, MLlib, Streaming e Grafos)"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Equipe Acadêmica - Sistemas de Informação" }
]
classifiers = [
    "Programming Language :: Python :: 3.7",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspark>=3.3.0",
    "findspark>=1.4.2",
    "py4j>=0.10.9"
]

[project.optional-dependencies]
dev = [
    "invoke>=2.2.0",
    "jupyter>=1.0.0",
    "black>=22.0",
    "flake8>=4.0"
]
test = [
    "pytest>=7.0"
]